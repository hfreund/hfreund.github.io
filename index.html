<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="all" />
    <meta name="description" content="Hugh Freund — designer and builder." />
    <meta name="author" content="Hugh Freund" />
    <title>Hugh Freund</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link href="assets/landing/landing.css?v=15" rel="stylesheet" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YHM3G6YENT"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-YHM3G6YENT");
    </script>
  </head>
  <body>
    <div class="bg-center-radial" id="bg-center-radial" aria-hidden="true"></div>
    <div class="crt-vignette" aria-hidden="true"></div>
    <div class="crt-lines" aria-hidden="true"></div>
    <div class="edge-border" id="edge-border" aria-hidden="true"></div>

    <main>
      <div class="terminal-wrap" id="terminal-block">
        <p class="terminal-line">
          <span id="typed"></span><span class="cursor" aria-hidden="true"></span>
        </p>
      </div>
    </main>

    <footer class="site-status" role="contentinfo">
      <div class="site-status__row">
        <nav class="site-status__nav" aria-label="Contact links">
          <a
            class="site-status__link"
            href="https://www.linkedin.com/in/hughfreund/"
            rel="noopener noreferrer"
            target="_blank"
            >LinkedIn</a>
          <span class="site-status__sep" aria-hidden="true">·</span>
          <a
            class="site-status__link"
            href="https://github.com/hfreund"
            rel="noopener noreferrer"
            target="_blank"
            >GitHub</a>
          <span class="site-status__sep" aria-hidden="true">·</span>
          <a class="site-status__link" href="mailto:hugh.freund@gmail.com">Email</a>
        </nav>
        <button type="button" class="site-status__mute" id="mute-btn" aria-pressed="false" hidden>
          Sound on
        </button>
      </div>
    </footer>

    <div id="sr-status" class="visually-hidden" role="status" aria-live="polite"></div>

    <button
      type="button"
      class="crt-debug-backdrop"
      id="crt-debug-backdrop"
      aria-hidden="true"
      tabindex="-1"
      title="Close scene tuning"
    ></button>

    <div
      class="crt-debug-drawer"
      id="crt-debug-drawer"
      role="dialog"
      aria-modal="true"
      aria-labelledby="crt-debug-title"
      aria-hidden="true"
    >
      <aside class="crt-debug-panel" id="crt-debug-panel" aria-label="Scene tuning controls">
        <header>
          <h2 id="crt-debug-title">Scene tuning</h2>
          <div class="crt-debug-actions">
            <button type="button" id="crt-debug-copy">Copy settings</button>
            <button type="button" id="crt-debug-reset">Reset defaults</button>
          </div>
        </header>
        <div class="crt-debug-grid">
          <div class="crt-debug-field">
            <label>
              Spacing <span class="crt-debug-value" id="crt-debug-val-gap">3px</span>
            </label>
            <input id="crt-debug-gap" type="range" min="0.5" max="24" step="0.5" value="3" />
          </div>
          <div class="crt-debug-field">
            <label>
              Line width <span class="crt-debug-value" id="crt-debug-val-line-w">1px</span>
            </label>
            <input id="crt-debug-line-w" type="range" min="0.5" max="8" step="0.5" value="1" />
          </div>
          <div class="crt-debug-field">
            <label>
              Diffusion <span class="crt-debug-value" id="crt-debug-val-diffusion">5.5</span>
              <span class="visually-hidden">(blur and glow spread)</span>
            </label>
            <input id="crt-debug-diffusion" type="range" min="0" max="100" step="0.5" value="5.5" />
          </div>
          <div class="crt-debug-field">
            <label>
              Line opacity <span class="crt-debug-value" id="crt-debug-val-opacity">30%</span>
            </label>
            <input id="crt-debug-opacity" type="range" min="0" max="100" step="1" value="30" />
          </div>
        </div>

        <h3 class="crt-debug-subhead">Center radial (behind vignette)</h3>
        <div class="crt-debug-grid">
          <div class="crt-debug-field">
            <label>
              Center opacity <span class="crt-debug-value" id="crt-debug-val-center-op">15%</span>
            </label>
            <input id="crt-debug-center-op" type="range" min="0" max="100" step="1" value="15" />
          </div>
          <div class="crt-debug-field">
            <label>
              Fade end <span class="crt-debug-value" id="crt-debug-val-center-fade">35%</span>
            </label>
            <input id="crt-debug-center-fade" type="range" min="25" max="80" step="1" value="35" />
          </div>
          <div class="crt-debug-field">
            <label>
              Ellipse W <span class="crt-debug-value" id="crt-debug-val-center-w">70%</span>
            </label>
            <input id="crt-debug-center-w" type="range" min="40" max="140" step="1" value="70" />
          </div>
          <div class="crt-debug-field">
            <label>
              Ellipse H <span class="crt-debug-value" id="crt-debug-val-center-h">100%</span>
            </label>
            <input id="crt-debug-center-h" type="range" min="40" max="140" step="1" value="100" />
          </div>
          <div class="crt-debug-field">
            <label>
              Center Y <span class="crt-debug-value" id="crt-debug-val-center-y">45%</span>
            </label>
            <input id="crt-debug-center-y" type="range" min="30" max="60" step="1" value="45" />
          </div>
        </div>

        <h3 class="crt-debug-subhead">Viewport border + glow</h3>
        <div class="crt-debug-grid">
          <div class="crt-debug-field">
            <label>
              Border opacity <span class="crt-debug-value" id="crt-debug-val-edge-border-op">30%</span>
            </label>
            <input id="crt-debug-edge-border-op" type="range" min="0" max="100" step="1" value="30" />
          </div>
          <div class="crt-debug-field">
            <label>
              Border width <span class="crt-debug-value" id="crt-debug-val-edge-bw">1px</span>
            </label>
            <input id="crt-debug-edge-bw" type="range" min="0.5" max="4" step="0.5" value="1" />
          </div>
          <div class="crt-debug-field">
            <label>
              Glow blur <span class="crt-debug-value" id="crt-debug-val-edge-glow">24px</span>
            </label>
            <input id="crt-debug-edge-glow" type="range" min="0" max="80" step="1" value="24" />
          </div>
          <div class="crt-debug-field">
            <label>
              Glow opacity <span class="crt-debug-value" id="crt-debug-val-edge-glow-op">28%</span>
            </label>
            <input id="crt-debug-edge-glow-op" type="range" min="0" max="100" step="1" value="28" />
          </div>
        </div>
        <pre class="crt-debug-output" id="crt-debug-output" aria-live="polite"></pre>
        <p class="crt-debug-hint">
          Defaults match <code>:root</code> in <code>landing.css</code>. Copy settings to update source.
        </p>
      </aside>
    </div>

    <script src="assets/landing/landing.js?v=17" defer></script>
  </body>
</html>
